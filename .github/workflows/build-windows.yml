
name: Build CrosshairLab Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up build-only Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run profile tests
        run: python -m unittest discover -s tests -v

      - name: Compile portable EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name CrosshairLab app.py

      - name: Validate artifact exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/CrosshairLab.exe')) {
            throw 'Windows EXE was not generated.'
          }

      - name: Upload downloadable EXE
        uses: actions/upload-artifact@v4
        with:
          name: CrosshairLab-v0.2-Windows-x64
          path: dist/CrosshairLab.exe
          if-no-files-found: error

      - name: Publish EXE to GitHub Releases on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" 'dist/CrosshairLab.exe' --generate-notes
